[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanguo-cards"
version = "0.1.0"
description = "重开三国 — Three Kingdoms card strategy game (text-first)"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sanguo = "sanguo.tui:main"
sanguo-art = "sanguo.art:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sanguo.data" = ["*.json"]
"sanguo.data.portraits" = ["*.json", "*.jpg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
