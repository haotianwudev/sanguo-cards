[project]
# 重开三国 is the Godot project in godot/. This file only lists what the Python tools in tools/ need
# (art pipeline, doc generators, voices). The old terminal version that used to live in src/ is gone.
name = "sanguo-cards-tools"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",       # art: sanguo_art.py, art_ingest.py, map_strip.py, chibi_token.py, prep_art.py
    "numpy>=1.26",      # art_ingest.py quality checks, map_guide.py
    "scipy>=1.11",      # art_ingest.py
    "fonttools>=4.40",  # build_fonts.py
    "edge-tts>=6",      # gen_voices.py fallback voices
    "imageio-ffmpeg>=0.5",  # gen_voices.py
]

[tool.uv]
package = false  # tools are plain scripts: `uv run python tools/<x>.py`
